<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="ESLAM — Barber shop. Personal page and contact links.">
  <title>ESLAM | Barber Shop</title>
  <style>
    :root { color-scheme: dark; --gold:#d6b15e; --gold2:#f4dfa0; --bg:#090909; --panel:#111; --muted:#b9b2a3; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background: radial-gradient(ellipse at 50% 0%, #292114 0, #111 38%, var(--bg) 75%);
      color:#f7f3e9; font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      width:min(100%, 440px); text-align:center; padding:34px 25px 25px;
      border:1px solid rgba(214,177,94,.55); border-radius:24px;
      background:linear-gradient(145deg, rgba(25,25,25,.97), rgba(8,8,8,.98));
      box-shadow:0 18px 60px #0009, inset 0 0 28px #d6b15e0a;
    }
    .avatar {
      width:112px; height:112px; margin:0 auto 20px; border-radius:50%;
      border:2px solid var(--gold); display:grid; place-items:center;
      color:var(--gold); background:#191919; overflow:hidden;
      box-shadow:0 0 0 6px #d6b15e12;
    }
    /* Add your photo file as profile.jpg in this folder to show it automatically. */
    .avatar img { width:100%; height:100%; object-fit:cover; display:none; }
    .initials { font-size:27px; font-weight:800; letter-spacing:3px; }
    h1 { margin:0; color:var(--gold2); font-size:clamp(36px, 10vw, 48px); letter-spacing:7px; font-weight:800; }
    .rule { width:74px; height:2px; margin:15px auto; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
    .bio { margin:0 0 25px; color:#eee5d1; font-size:16px; letter-spacing:.4px; }
    .links { display:grid; gap:11px; }
    .link {
      min-height:49px; display:flex; align-items:center; justify-content:center; gap:10px;
      padding:13px 16px; border:1px solid #5d4a23; border-radius:12px;
      color:var(--gold2); text-decoration:none; font-weight:700; letter-spacing:.4px;
      background:linear-gradient(90deg,#17140e,#211b0f,#17140e);
      transition:transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .link:hover { transform:translateY(-2px); border-color:var(--gold); background:#29200f; }
    .link.disabled { color:#777064; border-style:dashed; background:#121212; cursor:default; }
    .icon { width:19px; height:19px; display:inline-grid; place-items:center; font-size:18px; }
    .note { margin:22px 0 0; font-size:11px; color:#827a6a; }
    footer { margin-top:24px; color:#6e675b; font-size:10px; letter-spacing:2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-label="Profile photo placeholder">
      <<img id="profile-photo" src="Picsart_26-10-05_21-48.jpg" alt="ESLAM profile photo">">
      <span class="initials" id="initials">E</span>
    </div>
    <h1>ESLAM</h1>
    <div class="rule"></div>
    <p class="bio">Barber shop 💈</p>

    <nav class="links" aria-label="Contact and social links">
      <a class="link" href="https://wa.me/201159815783" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">✆</span> WhatsApp
      </a>
      <!-- Replace each placeholder href with your real profile URL when ready. -->
      <span class="link disabled" aria-label="Instagram link not added"><span class="icon">◎</span> Instagram · coming soon</span>
      <span class="link disabled" aria-label="Facebook link not added"><span class="icon">f</span> Facebook · coming soon</span>
      <span class="link disabled" aria-label="TikTok link not added"><span class="icon">♪</span> TikTok · coming soon</span>
    </nav>
    <p class="note">Black &amp; gold · Personal page</p>
    <footer>ESLAM</footer>
  </main>
  <script>
    const photo = document.getElementById('profile-photo');
    const initials = document.getElementById('initials');
    photo.addEventListener('load', () => { photo.style.display = 'block'; initials.style.display = 'none'; });
    photo.addEventListener('error', () => { photo.style.display = 'none'; initials.style.display = 'block'; });

</body>
</html>
